<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>DRONE LAB · 嗡鸣实验室</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#03040a radial-gradient(900px 500px at 50% -10%, rgba(90,0,120,.25), transparent 60%) no-repeat;
    color:#d8cce8;font-family:"Cascadia Code","JetBrains Mono",Consolas,Menlo,monospace;
    display:flex;flex-direction:column;overflow:hidden;user-select:none;
  }
  header{display:flex;align-items:baseline;gap:14px;padding:14px 22px 8px;border-bottom:1px solid rgba(180,120,255,.15)}
  h1{font-size:21px;letter-spacing:.22em;font-weight:900;color:#efe6ff;text-shadow:0 0 18px rgba(200,140,255,.55),2px 0 rgba(255,60,120,.5),-2px 0 rgba(0,255,220,.5)}
  .sub{font-size:11px;color:#7d6a99;letter-spacing:.5px}
  #stage{flex:1;position:relative;min-height:0;margin:8px 16px 4px;border:1px solid rgba(180,120,255,.18);border-radius:12px;overflow:hidden;background:#000}
  #viz{position:absolute;inset:0;width:100%;height:100%}
  #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,6,34,.9);border:1px solid rgba(220,150,255,.6);color:#e6d2ff;padding:8px 18px;font-size:12px;border-radius:8px;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none;letter-spacing:1px;white-space:nowrap}
  #toast.on{opacity:1}
  .hint{position:absolute;left:12px;bottom:9px;font-size:10.5px;color:rgba(190,160,225,.45);letter-spacing:.5px;z-index:5;pointer-events:none}
  #panel{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .g{font-size:10px;color:#7d6a99;letter-spacing:2px;margin-right:2px}
  button{font-family:inherit;font-size:12px;color:#cfc0e8;background:rgba(140,80,255,.07);border:1px solid rgba(180,120,255,.4);border-radius:8px;padding:8px 12px;cursor:pointer;letter-spacing:.5px;transition:all .12s}
  button:hover{background:rgba(180,120,255,.2);color:#fff;box-shadow:0 0 14px rgba(180,120,255,.35)}
  button:active{transform:translateY(1px)}
  button.on{background:rgba(255,70,140,.22);border-color:rgba(255,70,140,.75);color:#ffd2e4;box-shadow:0 0 14px rgba(255,70,140,.4)}
  .presets{display:flex;gap:8px;flex-wrap:wrap}
  .presets button{padding:7px 14px;font-size:13px}
  .presets small{display:block;font-size:9px;color:#8a7aa5;letter-spacing:1px}
  .knobRow{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .knob{display:flex;align-items:center;gap:7px;font-size:11px;color:#a28fbe}
  .knob input[type=range]{width:90px;accent-color:#c26bff;cursor:pointer}
  .knob b{color:#e8dbff;font-weight:600;min-width:26px;text-align:right;font-size:11px}
  #burstBtn{background:rgba(255,60,60,.1);border-color:rgba(255,80,80,.7);color:#ffc2c2;font-size:13px;padding:8px 20px;box-shadow:0 0 18px rgba(255,60,60,.15) inset}
  #burstBtn:hover{background:rgba(255,60,60,.3);box-shadow:0 0 24px rgba(255,60,60,.5)}
  #keys{display:flex;gap:4px}
  .key{width:44px;height:46px;border-radius:7px;background:rgba(120,80,190,.1);border:1px solid rgba(170,120,240,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#b9a6d6;cursor:pointer;transition:all .08s}
  .key b{font-size:15px;color:#e8dbff}
  .key:active,.key.hold{background:rgba(255,70,140,.35);border-color:rgba(255,70,140,.9);color:#fff;box-shadow:0 0 16px rgba(255,70,140,.5)}
  .vols{display:flex;gap:16px}
  .vol{display:flex;align-items:center;gap:6px;font-size:11px;color:#a28fbe}
  .vol input{width:70px;accent-color:#c26bff;cursor:pointer}
  #wake{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(3,4,10,.72);backdrop-filter:blur(4px)}
  #wake button{font-size:17px;padding:14px 34px;letter-spacing:2px}
  #wake .wsub{font-size:12px;color:#7d6a99}
  .dim{opacity:.35;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>DRONE LAB</h1>
  <span class="sub">嗡鸣实验室 // 电子制噪 · 三分钟成为灰野敬二</span>
  <span id="nowPatch" style="margin-left:auto;font-size:11px;color:#c26bff;letter-spacing:1px"></span>
</header>
<div id="stage">
  <canvas id="viz"></canvas>
  <div id="toast"></div>
  <div class="hint">鼠标在画面上横移 = 滤波扫频 · 上下 = 音量 · 点击 = 爆发 ⚡ 按键 A S D F G H = 换根音</div>
  <div id="wake">
    <button id="startBtn">🎧 进入嗡鸣</button>
    <div class="wsub">浏览器要你先点一下才出声 · 建议戴耳机 · 音量开小再探索</div>
  </div>
</div>
<div id="panel">
  <div class="row presets" id="presetRow">
    <span class="g">大师预设</span>
    <button data-p="nanjo">🎸 南条麻人<small>HIGH RISE 音墙</small></button>
    <button data-p="haino">😱 灰野敬二<small>嚎叫与静默</small></button>
    <button data-p="acid">🚀 酸母寺<small>太空长音</small></button>
    <button data-p="naoki">🌫️ 头士奈生树<small>嗡鸣噪匠</small></button>
  </div>
  <div class="row">
    <div class="knobRow">
      <div class="knob">音墙 <input type="range" id="distKnob" min="0" max="100" value="0"><b>0</b></div>
      <div class="knob">空间 <input type="range" id="spaceKnob" min="0" max="100" value="40"><b>40</b></div>
      <div class="knob">噪声 <input type="range" id="noiseKnob" min="0" max="100" value="0"><b>0</b></div>
      <div class="knob">滤波 <input type="range" id="cutKnob" min="60" max="9000" value="2400"><b>2400</b></div>
      <button id="burstBtn">💥 爆发（Space）</button>
      <div class="vols">
        <div class="vol">低音 <input type="range" id="droneVol" min="0" max="100" value="80"></div>
        <div class="vol">高音 <input type="range" id="padVol" min="0" max="100" value="55"></div>
        <div class="vol">麦克 <input type="range" id="micVol" min="0" max="100" value="80"></div>
      </div>
    </div>
  </div>
  <div class="row">
    <div id="keys"></div>
    <button id="micBtn" style="margin-left:auto">🎤 嚎叫通道（接麦克风）</button>
    <button id="silenceBtn">🕳 静默</button>
    <button id="autoBtn" class="on">▶ 即兴:开</button>
  </div>
</div>
<script>
(function(){
'use strict';
/* ============ 基础 ============ */
var AC = window.AudioContext || window.webkitAudioContext;
var ctx = null;
var master, limiter, bus, dist, filt, spaceSend, conv, delay, delayFb, micBus;
var droneSub, padSub, cleanMaster, noiseGainNode;
var analyser, freqData, waveData;
var state = { p:'haino', playing:false, burst:0, auto:true, micOn:false, root:55, silentUntil:0, silenceTimer:0, glissTimer:0, t:0 };
var droneOscs = [], padOscs = [];
var noiseSrc = null;
var patchName = '';

/* ============ 音频图构建 ============ */
function makeNoise(seconds, pink){
  var len = Math.floor(ctx.sampleRate * seconds);
  var b = ctx.createBuffer(1, len, ctx.sampleRate);
  var d = b.getChannelData(0);
  var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (var i = 0; i < len; i++){
    var w = Math.random()*2-1;
    if (pink){
      b0 = .99886*b0 + w*.0555179; b1 = .99332*b1 + w*.0750759;
      b2 = .96900*b2 + w*.1538520; b3 = .86650*b3 + w*.3104856;
      b4 = .55000*b4 + w*.5329522; b5 = -.7616*b5 - w*.0168980;
      d[i] = (b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6 = w*.115926;
    } else d[i] = w;
  }
  return b;
}
function makeImpulse(seconds, decay){
  var len = Math.floor(ctx.sampleRate * seconds);
  var b = ctx.createBuffer(2, len, ctx.sampleRate);
  for (var c = 0; c < 2; c++){
    var d = b.getChannelData(c);
    for (var i = 0; i < len; i++){
      var t = i / len;
      d[i] = (Math.random()*2-1) * Math.pow(1 - t, decay) * 3;
    }
  }
  return b;
}
function initAudio(){
  if (ctx) return;
  ctx = new AC();
  limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -10; limiter.ratio.value = 16; limiter.knee.value = 4;
  limiter.attack.value = 0.002; limiter.release.value = .18;
  limiter.connect(ctx.destination);
  master = ctx.createGain(); master.gain.value = .85; master.connect(limiter);
  /* 总线 → 失真 → 滤波 → 空间发送 + 干声 */
  bus = ctx.createGain(); bus.gain.value = 1;
  dist = ctx.createWaveShaper();
  dist.curve = makeTanh(420);
  dist.oversample = '4x';
  filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 2400; filt.Q.value = .6;
  bus.connect(dist); dist.connect(filt); filt.connect(master);
  /* 纯净通道：衬垫/空间走这里，避开失真 */
  cleanMaster = ctx.createGain(); cleanMaster.gain.value = .9; cleanMaster.connect(master);
  /* 声部分组 */
  droneSub = ctx.createGain(); droneSub.gain.value = .8; droneSub.connect(bus);
  padSub = ctx.createGain(); padSub.gain.value = .55;
  padSub.connect(cleanMaster);
  /* 空间：卷积混响(长指数衰减) + 反馈延迟 */
  conv = ctx.createConvolver();
  conv.buffer = makeImpulse(3.2, 2.6);
  spaceSend = ctx.createGain(); spaceSend.gain.value = .5;
  var wet = ctx.createGain(); wet.gain.value = .9;
  filt.connect(spaceSend); spaceSend.connect(conv); conv.connect(wet); wet.connect(master);
  padSub.connect(spaceSend);   /* 衬垫进空间（需在 spaceSend 就绪后） */
  delay = ctx.createDelay(1.2); delay.delayTime.value = .42;
  delayFb = ctx.createGain(); delayFb.gain.value = .42;
  var delayOut = ctx.createGain(); delayOut.gain.value = .5;
  filt.connect(delay); delay.connect(delayFb); delayFb.connect(delay);
  delay.connect(delayOut); delayOut.connect(master);
  /* 噪声层 */
  noiseSrc = ctx.createBufferSource();
  noiseSrc.buffer = makeNoise(4, true); noiseSrc.loop = true;
  noiseGainNode = ctx.createGain(); noiseGainNode.gain.value = 0;
  var noiseFilt = ctx.createBiquadFilter(); noiseFilt.type = 'bandpass'; noiseFilt.frequency.value = 500; noiseFilt.Q.value = 1;
  noiseSrc.connect(noiseFilt); noiseFilt.connect(noiseGainNode); noiseGainNode.connect(bus); noiseSrc.start();
  /* 麦克风嚎叫通道：mic → 高通 → 反馈延迟(自激潜力) → 主混响 */
  micBus = ctx.createGain(); micBus.gain.value = 0;
  var micHP = ctx.createBiquadFilter(); micHP.type = 'highpass'; micHP.frequency.value = 220;
  var micDelay = ctx.createDelay(1.4); micDelay.delayTime.value = .27;
  var micFb = ctx.createGain(); micFb.gain.value = .6;
  var micDelayOut = ctx.createGain(); micDelayOut.gain.value = .85;
  micBus.connect(micHP);
  micHP.connect(micDelay); micDelay.connect(micFb); micFb.connect(micDelay);
  micHP.connect(micDelayOut); micDelay.connect(micDelayOut);
  micDelayOut.connect(spaceSend); micDelayOut.connect(master);
  micHP.connect(spaceSend);
  analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
  master.connect(analyser);
  freqData = new Uint8Array(analyser.frequencyBinCount);
  waveData = new Uint8Array(analyser.fftSize);
}
function makeTanh(n){
  var c = new Float32Array(n);
  for (var i = 0; i < n; i++){
    var x = i * 2 / n - 1;
    c[i] = Math.tanh(3.2 * x);
  }
  return c;
}
function killOscs(arr){
  arr.forEach(function(o){ try{ o.stop(); }catch(e){} try{ o.disconnect(); }catch(e){} });
  arr.length = 0;
}
function setDist(v){
  /* 0..1 → tanh 强度 0..14 */
  if (ctx) dist.curve = makeTanh(Math.round(24 + v * 410));
}
/* ============ 预设 ============ */
var PRESETS = {
  nanjo: { name:'南条麻人 · HIGH RISE 音墙', root:45.9,   dist:.62, space:.5,  noise:.1, cut:2600,
    drone:[{s:0,t:'sawtooth',g:.16,d:9},{s:.02,t:'sawtooth',g:.14,d:-7},{s:7,t:'sawtooth',g:.10,d:14},{s:-12,t:'square',g:.12,d:3}],
    pad:[{s:12,t:'sawtooth',g:.05,d:5},{s:24,t:'sawtooth',g:.04,d:-8}], lfo:0.07, script:'bluesy' },
  haino:  { name:'灰野敬二 · 嚎叫与静默', root:51.9,   dist:.9,  space:.85, noise:.28, cut:5200,
    drone:[{s:0,t:'sawtooth',g:.19,d:23},{s:.5,t:'sawtooth',g:.17,d:-19},{s:6,t:'square',g:.11,d:0},{s:-6,t:'sawtooth',g:.10,d:31}],
    pad:[{s:13,t:'sawtooth',g:.06,d:40},{s:1,t:'sine',g:.10,d:0}], lfo:0.5, script:'haino' },
  acid:   { name:'酸母寺 · 太空长音', root:55,     dist:.12, space:.9,  noise:.05, cut:3600,
    drone:[{s:0,t:'sawtooth',g:.16,d:7},{s:.02,t:'sawtooth',g:.15,d:-6},{s:7,t:'sine',g:.13,d:0},{s:12,t:'sawtooth',g:.07,d:12}],
    pad:[{s:19,t:'sine',g:.06,d:0},{s:24,t:'sine',g:.05,d:0},{s:31,t:'sine',g:.04,d:0}], lfo:0.04, script:'cosmic' },
  naoki:  { name:'头士奈生树 · 嗡鸣噪匠', root:36.7,  dist:.32, space:.6,  noise:.42, cut:1900,
    drone:[{s:0,t:'triangle',g:.18,d:3},{s:.03,t:'triangle',g:.16,d:-2},{s:-12,t:'triangle',g:.14,d:5}],
    pad:[{s:9,t:'sine',g:.05,d:0},{s:16,t:'sine',g:.04,d:0}], lfo:0.12, script:'tick' }
};
function semisToHz(root, s){ return root * Math.pow(2, s / 12); }
function applyPreset(id){
  state.p = id;
  var p = PRESETS[id];
  var now = ctx.currentTime;
  /* 停旧声部 */
  killOscs(droneOscs); killOscs(padOscs);
  setDist(p.dist);
  filt.frequency.setTargetAtTime(p.cut, now, .4);
  spaceSend.gain.setTargetAtTime(p.space, now, .5);
  document.getElementById('noiseKnob').value = Math.round(p.noise * 100);
  document.getElementById('noiseKnob').dispatchEvent(new Event('input'));
  /* 低音 drone */
  p.drone.forEach(function(cfg){
    var o = ctx.createOscillator();
    o.type = cfg.t;
    o.frequency.value = semisToHz(state.root, cfg.s);
    o.detune.value = cfg.d;
    var g = ctx.createGain(); g.gain.value = cfg.g;
    o.connect(g); g.connect(droneSub);
    o.start();
    droneOscs.push(o);
  });
  /* 高音衬垫（纯净通道 + 空间） */
  p.pad.forEach(function(cfg){
    var o = ctx.createOscillator();
    o.type = cfg.t;
    o.frequency.value = semisToHz(state.root, cfg.s);
    o.detune.value = cfg.d;
    var g = ctx.createGain(); g.gain.value = cfg.g;
    o.connect(g); g.connect(padSub);
    o.start();
    padOscs.push(o);
  });
  /* 同步旋钮显示 */
  document.getElementById('distKnob').value = Math.round(p.dist * 100);
  document.getElementById('distKnob').parentElement.querySelector('b').textContent = Math.round(p.dist * 100);
  document.getElementById('spaceKnob').value = Math.round(p.space * 100);
  document.getElementById('spaceKnob').parentElement.querySelector('b').textContent = Math.round(p.space * 100);
  document.getElementById('cutKnob').value = Math.round(p.cut);
  document.getElementById('cutKnob').parentElement.querySelector('b').textContent = Math.round(p.cut);
  /* 调 LFO 呼吸（滤波慢摆） */
  filt.frequency.cancelScheduledValues(now);
  var lfo = ctx.createOscillator(); lfo.frequency.value = p.lfo;
  var lfoG = ctx.createGain(); lfoG.gain.value = p.cut * .22;
  lfo.connect(lfoG); lfoG.connect(filt.frequency); lfo.start();
  droneOscs.push(lfo);   /* 借用数组追踪 */
  patchName = p.name;
  document.getElementById('nowPatch').textContent = '🎛 ' + p.name;
  toast('「' + p.name + '」 上路了');
}
function keyByHz(hz){
  for (var i = 0; i < KEY_NOTES.length; i++){
    if (Math.abs(KEY_NOTES[i].hz - hz) < .5) return KEY_NOTES[i];
  }
  return null;
}
function setRootHz(hz, glide){
  var oldRoot = state.root || PRESETS[state.p].root;
  var ratio = hz / oldRoot;
  state.root = hz;
  var now = ctx.currentTime, tt = glide ? 0.5 : 0.06;
  /* 所有声部等比转调，保持音程堆叠 */
  droneOscs.concat(padOscs).forEach(function(o){
    if (o.type && o.frequency && o.frequency.value > 0 && o.frequency.value < 8000){
      o.frequency.cancelScheduledValues(now);
      o.frequency.setTargetAtTime(Math.max(18, o.frequency.value * ratio), now, tt);
    }
  });
  var keyName = keyByHz(hz);
  var el = document.getElementById('nowPatch');
  if (el && keyName) el.textContent = '🎛 ' + patchName + ' · 根音 ' + keyName.name;
}
/* 键盘：A小调低音八度 */
var KEY_NOTES = [
  {k:'a', name:'A', hz:55}, {k:'s', name:'C', hz:65.41}, {k:'d', name:'D', hz:73.42},
  {k:'f', name:'E', hz:82.41}, {k:'g', name:'G', hz:98}, {k:'h', name:'A2', hz:110}
];
function renderKeys(){
  var el = document.getElementById('keys');
  el.innerHTML = '';
  KEY_NOTES.forEach(function(n){
    var d = document.createElement('div');
    d.className = 'key';
    d.innerHTML = '<b>' + n.name + '</b>' + (n.hz > 80 ? '高' : '低');
    d.addEventListener('pointerdown', function(){
      if (!ctx || !state.playing) return;
      d.classList.add('hold');
      setRootHz(n.hz, true);
      if (state.p === 'haino') burst(0.5);
    });
    d.addEventListener('pointerup', function(){ d.classList.remove('hold'); });
    d.addEventListener('pointerleave', function(){ d.classList.remove('hold'); });
    el.appendChild(d);
  });
}
/* ============ 爆发 / 静默 / 即兴脚本 ============ */
function noiseBurst(t0, dur, vol, f0, f1){
  var s = ctx.createBufferSource();
  s.buffer = makeNoise(dur + .2, false);
  var bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.setValueAtTime(f0, t0);
  bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  bp.Q.value = 8;
  var g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + .012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(bp); bp.connect(g); g.connect(dist);
  s.start(t0); s.stop(t0 + dur + .2);
}
function screamGliss(t0, dur){
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sawtooth';
  var f0 = 300 + Math.random() * 700;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(f0 * (2.2 + Math.random() * 3), t0 + dur * .6);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(.3, t0 + .03);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
  o.connect(lp); lp.connect(g); g.connect(dist);
  o.start(t0); o.stop(t0 + dur + .1);
}
function burst(power){
  var t0 = ctx.currentTime;
  state.burst = 1;
  /* 瞬时把滤波推开再跌落 */
  filt.frequency.cancelScheduledValues(t0);
  filt.frequency.setValueAtTime(Math.max(4000, filt.frequency.value), t0);
  filt.frequency.exponentialRampToValueAtTime(PRESETS[state.p].cut, t0 + .7);
  /* 高频炸裂 */
  for (var i = 0; i < 4; i++){
    noiseBurst(t0 + i * .012, .05 + Math.random() * .1, .3 + Math.random() * .3, 900 + Math.random() * 4000, 300 + Math.random() * 2500);
  }
  screamGliss(t0, .5);
  screamGliss(t0 + .09, .6);
  setTimeout(function(){ state.burst = 0; }, 500);
}
function allMute(on){
  var g = on ? 0.0001 : .85;
  master.gain.setTargetAtTime(g, ctx.currentTime, on ? .25 : .08);
  if (!on) state.silentUntil = 0;
}
function tick(dt){
  state.burst = Math.max(0, state.burst - dt * 2);
  if (!state.auto || !ctx) return;
  var now = ctx.currentTime;
  var p = PRESETS[state.p];
  if (state.silentUntil && now > state.silentUntil){ state.silentUntil = 0; allMute(false); toast('（灰野式：复活）'); }
  if (p.script === 'haino'){
    state.silenceTimer -= dt;
    if (state.silenceTimer <= 0 && !state.silentUntil){
      state.silenceTimer = 1.4 + Math.random() * 3.2;
      var r = Math.random();
      if (r < .3){ state.silentUntil = now + .6 + Math.random() * 1.6; allMute(true); }
      else if (r < .75){ burst(.6 + Math.random() * .5); }
      else { screamGliss(now + .03, .8 + Math.random() * 1.6); }
    }
  } else if (p.script === 'cosmic'){
    state.glissTimer -= dt;
    if (state.glissTimer <= 0){
      state.glissTimer = 6 + Math.random() * 9;
      /* 高音滑奏星轨 */
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      var f0 = state.root * 8, f1 = f0 * (2 + Math.random());
      o.frequency.setValueAtTime(f0, now);
      o.frequency.exponentialRampToValueAtTime(f1, now + 2.2);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(.05, now + .8);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);
      o.connect(g); g.connect(spaceSend);
      o.start(now); o.stop(now + 3);
    }
  } else if (p.script === 'bluesy'){
    state.glissTimer -= dt;
    if (state.glissTimer <= 0){
      state.glissTimer = 3 + Math.random() * 4;
      var bend = ctx.createOscillator(), bg = ctx.createGain();
      bend.type = 'sawtooth';
      var f0 = state.root * 3.01;
      bend.frequency.setValueAtTime(f0, now);
      bend.frequency.linearRampToValueAtTime(f0 * 1.06, now + .3);
      bend.frequency.linearRampToValueAtTime(f0, now + .5);
      bg.gain.setValueAtTime(0.0001, now);
      bg.gain.exponentialRampToValueAtTime(.16, now + .02);
      bg.gain.exponentialRampToValueAtTime(0.0001, now + .55);
      bend.connect(bg); bg.connect(dist);
      bend.start(now); bend.stop(now + .6);
    }
  } else if (p.script === 'tick'){
    state.glissTimer -= dt;
    if (state.glissTimer <= 0){
      state.glissTimer = .5 + Math.random() * 1.8;
      noiseBurst(now, .01 + Math.random() * .04, .12 + Math.random() * .2, 200 + Math.random() * 700, 200 + Math.random() * 500);
    }
  }
}
/* ============ 可视化 ============ */
var viz = document.getElementById('viz');
var vx = viz.getContext('2d');
var W = 0, H = 0, lastT = 0, mouseX = .5, mouseY = .5;
function resizeV(){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var w = viz.clientWidth, h = viz.clientHeight;
  if (w && h && (viz.width !== w * dpr || viz.height !== h * dpr)){ viz.width = w * dpr; viz.height = h * dpr; }
  W = viz.width; H = viz.height;
}
function drawViz(){
  if (!W) resizeV();
  vx.clearRect(0, 0, W, H);
  var playing = ctx && state.playing;
  /* 背景：爆发红晕 + 音高辉光 */
  var grd = vx.createRadialGradient(W * .5, H * .5, 0, W * .5, H * .5, Math.max(W, H) * .6);
  grd.addColorStop(0, 'rgba(' + (playing ? '30,10,60' : '8,6,20') + ',1)');
  grd.addColorStop(1, 'rgba(2,2,8,1)');
  vx.fillStyle = grd; vx.fillRect(0, 0, W, H);
  var cx = W * .5, cy = H * .5;
  if (playing){
    analyser.getByteTimeDomainData(waveData);
    analyser.getByteFrequencyData(freqData);
    var lvl = 0;
    for (var i = 0; i < 512; i++) lvl += Math.abs(waveData[i] - 128);
    lvl = lvl / 512 / 128;
    /* 外圈：频谱茎 */
    var n = 96;
    for (var i2 = 0; i2 < n; i2++){
      var v = freqData[Math.floor(Math.pow(i2 / n, 1.6) * 400)] / 255;
      var a = i2 / n * Math.PI * 2 + state.t * .4;
      var r = H * .18 + v * H * .30 * (1 + state.burst * 2);
      var hue = (state.t * 22 + i2 * 2) % 360;
      vx.strokeStyle = 'hsla(' + hue + ',90%,' + (55 + v * 20) + '%,' + (.25 + v * .6) + ')';
      vx.lineWidth = Math.max(1, W / 300);
      vx.beginPath();
      vx.moveTo(cx + Math.cos(a) * H * .17, cy + Math.sin(a) * H * .17);
      vx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      vx.stroke();
    }
    /* 中心波形 */
    vx.beginPath();
    for (var k = 0; k < W; k += 3){
      var idx = Math.floor(k / W * 800);
      var y = cy + (waveData[idx] - 128) / 128 * H * .2 * (1 + lvl);
      if (k === 0) vx.moveTo(k, y); else vx.lineTo(k, y);
    }
    vx.strokeStyle = 'rgba(210,240,255,.8)';
    vx.lineWidth = 2;
    vx.stroke();
    /* 爆发闪光 */
    if (state.burst > .05){
      vx.fillStyle = 'rgba(255,80,80,' + state.burst * .25 + ')';
      vx.fillRect(0, 0, W, H);
    }
    if (state.silentUntil){
      vx.fillStyle = 'rgba(0,0,0,' + .55 + ')';
      vx.fillRect(0, 0, W, H);
      vx.fillStyle = 'rgba(200,160,255,.5)';
      vx.font = Math.floor(H * .05) + 'px Consolas, monospace';
      vx.textAlign = 'center';
      vx.fillText('静默……', cx, cy);
    }
    /* 鼠标滤波圈 */
    if (mouseInside){
      vx.strokeStyle = 'rgba(150,200,255,.25)';
      vx.lineWidth = 1;
      vx.beginPath();
      vx.arc(mouseX * W, mouseY * H, 44, 0, Math.PI * 2);
      vx.stroke();
    }
  } else {
    vx.fillStyle = 'rgba(200,160,255,.3)';
    vx.font = Math.floor(H * .06) + 'px Consolas, monospace';
    vx.textAlign = 'center';
    vx.fillText('· · · 静 默 · · ·', cx, cy);
  }
}
/* ============ UI ============ */
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('on'); }, 1600);
}
document.getElementById('startBtn').addEventListener('click', function(){
  initAudio();
  ctx.resume();
  state.playing = true;
  state.root = PRESETS.haino.root;
  applyPreset('haino');
  document.getElementById('wake').style.display = 'none';
  document.querySelectorAll('[data-p]').forEach(function(b){ b.classList.remove('on'); });
  document.querySelector('[data-p="haino"]').classList.add('on');
  toast('嗡鸣开始。A~H 换根音，Space 爆发，即兴模式已开启');
});
document.getElementById('presetRow').addEventListener('click', function(e){
  var b = e.target.closest('[data-p]');
  if (!b || !ctx) return;
  document.querySelectorAll('[data-p]').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on');
  applyPreset(b.dataset.p);
});
document.getElementById('burstBtn').addEventListener('click', function(){ burst(1); });
document.getElementById('silenceBtn').addEventListener('click', function(){
  if (!ctx) return;
  if (!state.silentUntil){ state.silentUntil = ctx.currentTime + 1.2; allMute(true); toast('🕳 静默降临'); }
  else { state.silentUntil = 0; allMute(false); }
});
document.getElementById('autoBtn').addEventListener('click', function(){
  state.auto = !state.auto;
  this.classList.toggle('on', state.auto);
  this.textContent = state.auto ? '▶ 即兴:开' : '⏸ 即兴:关';
});
/* 旋钮 */
function bindKnob(id, fn){
  var el = document.getElementById(id);
  el.addEventListener('input', function(){
    var v = +this.value;
    var out = el.parentElement.querySelector('b');
    if (out) out.textContent = v;
    fn(v, el);
  });
}
bindKnob('distKnob', function(v){ setDist(v / 100); });
bindKnob('spaceKnob', function(v){
  if (ctx) spaceSend.gain.setTargetAtTime(v / 100 * 1.1, ctx.currentTime, .1);
});
bindKnob('noiseKnob', function(v){
  if (ctx && noiseGainNode) noiseGainNode.gain.setTargetAtTime(v / 100 * .5, ctx.currentTime, .1);
});
bindKnob('cutKnob', function(v){
  if (ctx) filt.frequency.setTargetAtTime(v, ctx.currentTime, .05);
});
document.getElementById('droneVol').addEventListener('input', function(){
  if (ctx) droneSub.gain.setTargetAtTime(this.value / 100 * 1.4, ctx.currentTime, .08);
});
document.getElementById('padVol').addEventListener('input', function(){
  if (ctx) padSub.gain.setTargetAtTime(this.value / 100, ctx.currentTime, .08);
});
/* ============ 鼠标演奏：X=滤波 Y=音量 ============ */
var mouseInside = false;
viz.addEventListener('pointermove', function(e){
  var r = viz.getBoundingClientRect();
  mouseX = (e.clientX - r.left) / r.width;
  mouseY = 1 - (e.clientY - r.top) / r.height;
  mouseInside = true;
  if (ctx && state.playing){
    filt.frequency.setTargetAtTime(60 + mouseX * 7000, ctx.currentTime, .06);
    bus.gain.setTargetAtTime(.15 + mouseY * 1.2, ctx.currentTime, .08);
  }
});
viz.addEventListener('pointerleave', function(){ mouseInside = false; });
viz.addEventListener('pointerdown', function(){ if (ctx) burst(.8); });
window.addEventListener('keydown', function(e){
  if (e.code === 'Space'){ e.preventDefault(); if (ctx) burst(1); }
  for (var i = 0; i < KEY_NOTES.length; i++){
    if (KEY_NOTES[i].k === e.key.toLowerCase() && ctx){ setRootHz(KEY_NOTES[i].hz, true); break; }
  }
});
/* ============ 麦克风嚎叫通道 ============ */
var micBtn = document.getElementById('micBtn');
var micStream = null;
micBtn.addEventListener('click', function(){
  if (micStream){
    micStream.getTracks().forEach(function(t){ t.stop(); });
    micStream = null;
    micBus.gain.setTargetAtTime(0.0001, ctx.currentTime, .1);
    micBtn.classList.remove('on');
    micBtn.textContent = '🎤 嚎叫通道（接麦克风）';
    toast('麦克风已断开');
    return;
  }
  navigator.mediaDevices.getUserMedia({audio: true}).then(function(stream){
    micStream = stream;
    var src = ctx.createMediaStreamSource(stream);
    src.connect(micBus);
    micBus.gain.setTargetAtTime(document.getElementById('micVol').value / 100, ctx.currentTime, .1);
    micBtn.classList.add('on');
    micBtn.textContent = '🔴 嚎叫中……（再点断开）';
    toast('🎤 嚎吧！你的声音进反馈延迟了 —— 灰野敬二通道');
  }).catch(function(){
    toast('麦克风被拒或不可用');
  });
});
document.getElementById('micVol').addEventListener('input', function(){
  if (ctx && micStream) micBus.gain.setTargetAtTime(this.value / 100, ctx.currentTime, .05);
});
/* ============ 主循环 ============ */
var last = performance.now();
setInterval(function(){ tick(.1); }, 100);
function loop(now){
  var dt = Math.min(.05, (now - last) / 1000);
  last = now;
  state.t = (state.t || 0) + dt;
  drawViz();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', resizeV);
renderKeys();
resizeV();
requestAnimationFrame(loop);
})();
</script>
